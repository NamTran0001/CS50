<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                let correct = document.querySelector(".correct");

                correct.addEventListener("click", function() {
                    correct.style.backgroundColor = "green";
                    document.querySelector("#result").innerHTML = "Correct!";
                });

                let incorrects = document.querySelectorAll(".incorrect");
                for (let button of incorrects)
                {
                    button.addEventListener("click", function() {
                        button.style.backgroundColor = "red";
                        document.querySelector("#result").innerHTML = "Incorrect!";
                    });
                }
                document.querySelector("#check").addEventListener("click", function() {
                    let input = document.querySelector("#answer");

                    if(input.value == "Switzerland")
                    {
                        document.querySelector("#result2").innerHTML = "Correct!";
                    }
                    else
                    {
                        document.querySelector("#result2").innerHTML = "Incorrect!";
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What is the approximate ratio of people to sheep in New Zealand?</h3>
                <button class="incorrect">6 people per 1 sheep</button>
                <button class="incorrect">3 people per 1 sheep</button>
                <button class="incorrect">1 people per 1 sheep</button>
                <button class="correct">1 people per 5 sheep</button>
                <p id="result"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>In which country is it illegal to own only one guinea pig, as a lone guinea pig might get lonely?</h3>
                <input id="answer" >
                <button id="check" >Check Answer</button>
                <p id="result2"></p>
            </div>
        </div>
    </body>
</html>
